            - paragraph [ref=f1e131]: 01 — Generazione
            - paragraph [ref=f1e132]: Il prompt viene strutturato con role, contesto, vincoli normativi e formato atteso. Il modello produce una prima risposta trattata come bozza da verificare, non come testo definitivo.
          - generic [ref=f1e133]:
            - paragraph [ref=f1e134]: 02 — Verifica
            - paragraph [ref=f1e135]: La risposta viene interrogata con un prompt di controllo che chiede al modello di elencare le fonti, evidenziare le incertezze e segnalare i punti che richiedono verifica umana. Questa fase isola le allucinazioni prima che raggiungano il documento finale.
          - generic [ref=f1e136]:
            - paragraph [ref=f1e137]: 03 — Convergenza
            - paragraph [ref=f1e138]: Il professionista valuta gli esiti della verifica, integra le fonti primarie e chiude il ciclo con la propria firma. L'AI ha prodotto materiale di lavoro; la responsabilità rimane integralmente in capo al professionista iscritto all'albo.
