  - main [ref=f4e12]:
    - generic [ref=f4e14]:
      - paragraph [ref=f4e15]: CLP — Percorsi di Conformità AI
      - heading "Art. 50 AI Act. In vigore. Il 2 dicembre 2026 il regime transitorio si chiude." [level=1] [ref=f4e17]
      - paragraph [ref=f4e18]: Se la tua organizzazione usa chatbot, genera contenuti con AI o impiega sistemi di riconoscimento emotivo o biometrico, gli obblighi di trasparenza dell'Art. 50 ti riguardano già. Il percorso di conformità è un servizio professionale — guide, template e slides elaborati personalmente dall'Avv. Cuomo — per portare la tua organizzazione in regola prima delle ispezioni.
      - generic [ref=f4e19]:
        - link "Richiedi un preventivo →" [ref=f4e20] [cursor=pointer]:
          - /url: "#richiedi-percorso"
        - link "Cosa include →" [ref=f4e21] [cursor=pointer]:
          - /url: "#percorso"
    - generic [ref=f4e23]:
      - paragraph [ref=f4e24]: Il quadro normativo
      - heading "Quattro obblighi. Due categorie di soggetti. Una scadenza." [level=2] [ref=f4e26]
      - generic [ref=f4e27]:
        - paragraph [ref=f4e28]:
          - text: L'Art. 50 del Regolamento AI (UE) 2024/1689 introduce obblighi di trasparenza per i sistemi che interagiscono con persone fisiche, generano contenuti sintetici, riconoscono emozioni o producono deepfake. Si applica ai
          - strong [ref=f4e29]: Provider
          - text: — chi sviluppa o immette sul mercato un sistema AI — e ai
          - strong [ref=f4e30]: Deployer
          - text: — chi lo usa in un contesto professionale o commerciale.
        - paragraph [ref=f4e31]: "La distinzione non è formale. Chi acquista un chatbot commerciale e lo integra nel proprio sito è un Deployer, anche senza aver scritto una riga di codice. Ha obblighi propri: informare gli utenti che stanno interagendo con un sistema AI, raccogliere i consensi previsti, conservare i log di disclosure. Le sanzioni arrivano fino a 15 milioni di euro o al 3% del fatturato globale annuo."
        - paragraph [ref=f4e32]: Le Guidelines della Commissione Europea di luglio 2026 hanno chiarito i punti aperti sul testo del Regolamento. Il regime transitorio si chiude il 2 dicembre 2026.
      - generic [ref=f4e33]:
        - generic [ref=f4e34]:
          - paragraph [ref=f4e35]: Art. 50(1)
          - paragraph [ref=f4e36]: Interazione diretta
          - paragraph [ref=f4e37]: "Chatbot, assistenti vocali, avatar AI: l'utente deve sapere che non sta interagendo con un essere umano."
        - generic [ref=f4e38]:
          - paragraph [ref=f4e39]: Art. 50(2)
          - paragraph [ref=f4e40]: Contenuti sintetici
          - paragraph [ref=f4e41]: "Immagini, audio, video e testo generati da AI: obbligo di marcatura e rilevabilità. Watermark, metadati, standard C2PA."
        - generic [ref=f4e42]:
          - paragraph [ref=f4e43]: Art. 50(3)
          - paragraph [ref=f4e44]: Emotion & Biometrico
          - paragraph [ref=f4e45]: "Sistemi che inferiscono stati emotivi o categorizzano biometricamente: informativa obbligatoria, coordinamento con GDPR."
        - generic [ref=f4e46]:
          - paragraph [ref=f4e47]: Art. 50(4)
          - paragraph [ref=f4e48]: Deepfake e interesse pubblico
          - paragraph [ref=f4e49]: "Contenuti che ritraggono persone o eventi reali in modo non autentico: labeling esplicito, eccezioni circoscritte."
    - generic [ref=f4e51]:
