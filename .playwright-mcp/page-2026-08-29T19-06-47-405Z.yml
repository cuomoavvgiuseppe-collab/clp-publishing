    - generic [ref=f4e194]:
      - paragraph [ref=f4e195]: Domande frequenti
      - heading "Quello che ci chiedono prima di decidere." [level=2] [ref=f4e196]
      - generic [ref=f4e197]:
        - generic [ref=f4e198]:
          - paragraph [ref=f4e199]: Siamo una PMI. L'Art. 50 si applica anche a noi?
          - paragraph [ref=f4e200]: "Sì. L'Art. 50 non ha soglie dimensionali: si applica a qualsiasi organizzazione che usa o mette sul mercato sistemi AI che rientrano nelle quattro categorie. Una PMI con un chatbot sul sito è un Deployer con obblighi concreti. Il livello Orientamento è pensato esattamente per capire cosa vi riguarda e cosa potete rimandare."
        - generic [ref=f4e201]:
          - paragraph [ref=f4e202]: Il nostro fornitore di chatbot non ci ha detto nulla. Sono loro i responsabili, no?
          - paragraph [ref=f4e203]: Parzialmente. Il Provider ha obblighi propri — tra cui informare il Deployer degli obblighi residui. Ma il Deployer risponde in autonomia di fronte alle autorità di vigilanza per la corretta applicazione degli obblighi sul proprio sito o servizio. Se il fornitore non vi ha fornito documentazione adeguata, questo è già un segnale da gestire — il percorso include una clausola contrattuale tipo da inserire nei contratti con i fornitori AI.
        - generic [ref=f4e204]:
          - paragraph [ref=f4e205]: Possiamo aspettare che arrivi una guidance più chiara prima di muoverci?
          - paragraph [ref=f4e206]: "Le Guidelines della Commissione di luglio 2026 sono già disponibili e costituiscono la fonte interpretativa ufficiale. Il regime transitorio scade il 2 dicembre 2026: dopo quella data gli obblighi sono pienamente esecutivi. Chi inizia a strutturare la conformità ora ha il tempo di farlo con ordine; chi aspetta rischia di farlo sotto pressione — o dopo la prima ispezione."
        - generic [ref=f4e207]:
          - paragraph [ref=f4e208]: Cosa succede concretamente se non siamo conformi?
          - paragraph [ref=f4e209]: Le autorità di vigilanza nazionali (in Italia, l'Agenzia per la Cybersicurezza Nazionale e il Garante Privacy in coordinamento con la Commissione) possono avviare procedimenti che portano a sanzioni fino a 15 milioni di euro o al 3% del fatturato mondiale annuo, a seconda della gravità. Le violazioni dell'Art. 50 rientrano nella fascia intermedia del sistema sanzionatorio.
        - generic [ref=f4e210]:
          - paragraph [ref=f4e211]: Come riceviamo i materiali una volta accettato il preventivo?
          - paragraph [ref=f4e212]: "Tramite email o cartella condivisa protetta, entro i tempi indicati nel preventivo. Non ci sono piattaforme di accesso esterne, abbonamenti o credenziali da gestire. I file sono editabili e commentati: possono essere adattati con il vostro brand e la vostra intestazione senza richiedere ulteriori elaborazioni."
