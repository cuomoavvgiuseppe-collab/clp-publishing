            - paragraph [ref=f4e62]: "Quadro normativo completo: timeline aggiornata (incluso Digital Omnibus), distinzione Provider vs Deployer con criteri delle Guidelines, sintesi dei 4 obblighi, Art. 50(5), sanzioni e autorità di vigilanza, rapporto con GDPR e AI literacy (Art. 4), Quick Start Checklist 30 giorni."
