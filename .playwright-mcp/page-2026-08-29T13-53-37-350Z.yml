    - generic [ref=e21]:
      - paragraph [ref=e22]: Cos'è
      - heading "La consulenza preventiva scritta, in breve" [level=2] [ref=e23]
      - generic [ref=e24]:
        - paragraph [ref=e25]:
          - text: Una consulenza preventiva è un parere scritto su una domanda
          - strong [ref=e26]: generale
          - text: ", posta prima di usare un metodo — non l'analisi di un caso concreto già in corso. Chiedi come strutturare un prompt anti-allucinazione per la tua materia, non di scrivere il prompt sul tuo cliente specifico: quella è una consulenza personalizzata, un servizio diverso."
        - paragraph [ref=e27]: È preventiva perché arriva prima dell'errore, non dopo. Un modello linguistico che cita un regolamento europeo abrogato, confonde due discipline affini, o omette un riferimento normativo verificabile produce un output che sembra corretto — finché qualcuno, spesso il cliente o un giudice, non lo controlla. Il momento in cui scopri il problema del metodo non dovrebbe essere quello in cui hai già un cliente in attesa.
        - paragraph [ref=e28]: È scritta perché resta. Non un consiglio a voce che si ricostruisce a memoria, ma un parere che puoi rileggere, allegare a una nota interna del tuo studio, usare come riferimento la prossima volta che affronti la stessa materia.
    - generic [ref=e30]:
      - paragraph [ref=e31]: Perché
      - heading "Cosa cambia, rispetto a procedere da soli" [level=2] [ref=e32]
      - generic [ref=e33]:
        - generic [ref=e34]:
          - paragraph [ref=e35]: "01"
          - heading "Il rischio si vede prima di materializzarsi" [level=3] [ref=e36]
          - paragraph [ref=e37]: La normativa cambia con una frequenza che un modello linguistico non sempre riflette correttamente. Un parere preventivo individua dove il tuo prompt rischia di appoggiarsi su una base normativa non più vigente — prima che quel rischio finisca in un documento firmato da te.
        - generic [ref=e38]:
          - paragraph [ref=e39]: "02"
          - heading "Il metodo è validato, non improvvisato" [level=3] [ref=e40]
          - paragraph [ref=e41]: Il parere si fonda sullo stesso metodo di verifica a due passaggi — identificazione, poi verifica — che è già alla base dei pack di Cuomo Legal Publishing. Non un'opinione estemporanea, ma l'applicazione di un approccio testato su decine di materie.
        - generic [ref=e42]:
          - paragraph [ref=e43]: "03"
          - heading "Risposta scritta, non un consiglio informale" [level=3] [ref=e44]
          - paragraph [ref=e45]: "Un parere scritto ha un valore diverso da uno scambio a voce: è verificabile, riutilizzabile, condivisibile con i colleghi del tuo studio."
        - generic [ref=e46]:
          - paragraph [ref=e47]: "04"
          - heading "Nessun impegno prima di sapere il costo" [level=3] [ref=e48]
          - paragraph [ref=e49]: Poni la domanda, ricevi un preventivo scritto con il compenso. Decidi tu se procedere. Nessun pacchetto, nessun prezzo di listino, nessun acquisto necessario per fare la domanda.
