    - generic [ref=e13]:
      - paragraph [ref=e14]: CLP Cuomo Legal Consulenza Preventiva
      - heading "Scrivere un prompt sbagliato costa più di scriverlo bene la prima volta." [level=1] [ref=e15]
      - paragraph [ref=e16]: Una consulenza preventiva è un parere scritto — non un incontro, non una chiamata — con cui verifichi il tuo approccio prima di usarlo su un caso vero. Prima di scrivere il prompt che finirà nel tuo flusso di lavoro quotidiano, verifica con chi ha validato il metodo.
