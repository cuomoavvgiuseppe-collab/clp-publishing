          - paragraph [ref=e58]: "Scegli la materia che ti interessa tra quelle disponibili e scrivi la tua domanda con parole tue. Non deve essere formulata in linguaggio tecnico: basta che sia chiaro cosa vuoi capire del metodo."
        - generic [ref=e59]:
