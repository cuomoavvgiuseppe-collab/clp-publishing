          - paragraph [ref=e66]: Confermato il preventivo, ricevi il parere scritto personale dell'Avv. Cuomo, con i tempi indicati nel preventivo stesso.
      - paragraph [ref=e67]: Nessun file è scaricabile dal sito. Il prompt pack e il kit di conformità, quando previsti nel preventivo, sono allegati del parere e si consegnano solo dopo l'accettazione — via PEC o email dello studio.
