    - generic [ref=e232]:
      - paragraph [ref=e233]: Domande frequenti
      - heading "Quello che viene chiesto più spesso, con una risposta diretta" [level=2] [ref=e234]
      - generic [ref=e235]:
        - generic [ref=e236]:
          - paragraph [ref=e237]: Quanto costa la consulenza preventiva?
          - paragraph [ref=e238]: "Il compenso viene indicato nel preventivo scritto che ricevi entro 24 ore lavorative dalla tua domanda, ai sensi dell'art. 13 L. 247/2012. Non esiste un prezzo fisso di listino: dipende dalla complessità della domanda e dall'ambito professionale. Porre la domanda non comporta nessun costo: il compenso si paga solo se accetti il preventivo e vuoi procedere."
        - generic [ref=e239]:
          - paragraph [ref=e240]: In quanto tempo ricevo il parere?
          - paragraph [ref=e241]: Il preventivo arriva entro 24 ore lavorative dalla ricezione della domanda. I tempi di elaborazione del parere sono indicati nel preventivo stesso e variano in base al carico di lavoro corrente — di norma da 2 a 5 giorni lavorativi dalla conferma dell'accettazione. Non vengono indicati tempi che non possono essere rispettati.
        - generic [ref=e242]:
          - paragraph [ref=e243]: Posso fare più di una domanda per parere?
          - paragraph [ref=e244]: "Il parere risponde a una domanda metodologica principale. Se la domanda riguarda più aspetti del metodo strettamente correlati nella stessa materia, vengono trattati nello stesso parere. Se le questioni riguardano aree professionali diverse, è preferibile richiedere pareri separati: ogni materia ha logiche di verifica specifiche che perdono precisione se mescolate."
        - generic [ref=e245]:
          - paragraph [ref=e246]: La consulenza si applica a qualsiasi modello linguistico?
          - paragraph [ref=e247]: "Sì. Il metodo Loop Engineering™ è indipendente dalla piattaforma: si applica con ChatGPT, Claude, Gemini, o qualsiasi altro modello testuale attuale o futuro. Il parere descrive la logica della struttura, non le istruzioni specifiche di un'interfaccia. Gli esempi illustrativi sono adattabili senza modifica sostanziale a qualsiasi ambiente."
        - generic [ref=e248]:
          - paragraph [ref=e249]: Il parere è riservato?
          - paragraph [ref=e250]: Sì. Il contenuto del parere è strettamente riservato. Non viene condiviso, pubblicato, né utilizzato in forma anonimizzata senza consenso esplicito. La domanda stessa viene trattata con la stessa riservatezza di qualsiasi comunicazione professionale.
        - generic [ref=e251]:
          - paragraph [ref=e252]: Posso richiedere una consulenza su una materia non presente nell'elenco?
          - paragraph [ref=e253]: "L'elenco delle materie disponibili copre le aree più frequentemente richieste, ma non è chiuso. Se la tua area non è presente, puoi indicarla nella domanda: l'ammissibilità viene valutata caso per caso e comunicata nel preventivo, senza costi aggiuntivi per la sola valutazione."
        - generic [ref=e254]:
          - paragraph [ref=e255]: Il parere vale come consulenza professionale sulla mia situazione specifica?
          - paragraph [ref=e256]: No. La consulenza preventiva ha per oggetto il metodo — come strutturare l'uso dell'AI in una specifica materia professionale. Non esamina fatti, non analizza casi concreti, non produce orientamenti su situazioni specifiche del richiedente. Chi ha bisogno di un parere su un caso determinato deve instaurare un rapporto professionale formale con il professionista competente per quella materia.
        - generic [ref=e257]:
          - paragraph [ref=e258]: Il parere include i prompt già pronti?
          - paragraph [ref=e259]: "Il parere contiene esempi illustrativi delle tre fasi del metodo, calibrati sulla materia o sulla categoria. Se per quella categoria è già stato redatto un prompt pack di studio, il preventivo indica se viene allegato al parere. In ogni caso i prompt sono bozze di lavoro: non si firmano, non si usano senza verifica sulle fonti ufficiali, e non si scaricano dal sito."
        - generic [ref=e260]:
          - paragraph [ref=e261]: Posso scaricare il materiale dopo aver accettato il preventivo?
          - paragraph [ref=e262]: No. Non esiste un'area download. Dopo l'accettazione del preventivo lo studio consegna il parere — e gli eventuali allegati — con le modalità indicate nel preventivo, di norma via PEC o email.
        - generic [ref=e263]:
          - paragraph [ref=e264]: È un negozio online?
          - paragraph [ref=e265]: "No. È un servizio di consulenza professionale ai sensi dell'art. 13 L. 247/2012. Il compenso viene indicato nel preventivo scritto. Porre la domanda è gratuito: nessun addebito prima dell'accettazione."
      - generic [ref=e266]:
        - paragraph [ref=e267]: Nota deontologica
        - paragraph [ref=e268]: La consulenza preventiva descritta in questa pagina ha per oggetto esclusivo l'ingegneria dei prompt applicata al lavoro professionale e il metodo di verifica anti-allucinazione sviluppato dall'Avv. Cuomo. Non costituisce in alcun caso un parere su una situazione di fatto concreta, né un rapporto di assistenza o rappresentanza professionale. Le informazioni contenute nel parere hanno carattere metodologico e illustrativo, non orientano né sostituiscono il giudizio professionale del professionista che le applica. Per consulenze su casi specifici, è necessario instaurare un rapporto professionale formale con il professionista competente per quella materia.
