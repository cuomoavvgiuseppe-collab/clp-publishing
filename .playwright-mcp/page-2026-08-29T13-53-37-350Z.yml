    - generic [ref=e83]:
      - paragraph [ref=e84]: Come porre la domanda
      - heading "Una domanda ben formulata produce un parere più utile" [level=2] [ref=e85]
      - paragraph [ref=e86]: "Non esiste una domanda sbagliata, ma esiste una domanda che produce un parere più preciso. La differenza non sta nel livello tecnico — non è necessario conoscere la materia per porre la domanda giusta. Sta nella chiarezza dell'obiettivo metodologico: dire cosa si vuole capire del metodo in quella materia, non descrivere la propria situazione specifica."
      - generic [ref=e87]:
        - generic [ref=e88]:
          - paragraph [ref=e89]: Domanda poco utile
          - paragraph [ref=e90]: «Vorrei sapere come usare l'AI nella mia professione.»
          - paragraph [ref=e91]: «Come faccio a verificare una norma con l'AI?»
          - paragraph [ref=e92]: «Quale prompt uso per la mia materia?»
        - generic [ref=e93]:
          - paragraph [ref=e94]: Domanda utile
          - paragraph [ref=e95]: «Nella redazione di un DVR, come va strutturata la fase di verifica normativa perché il modello non citi disposizioni del D.Lgs. 81/2008 non più vigenti?»
          - paragraph [ref=e96]: «In materia di dichiarazione dei redditi, quale ciclo di verifica è più adatto a intercettare aliquote o detrazioni non aggiornate?»
      - generic [ref=e97]:
        - generic [ref=e98]:
          - paragraph [ref=e99]: "01"
          - heading "Indica la materia e il tipo di attività, non il caso specifico" [level=3] [ref=e100]
          - paragraph [ref=e101]: «Come si struttura la verifica normativa in materia di appalti pubblici?» è una domanda metodologica sulla materia. «Come gestisco questa gara per il mio cliente?» è una consulenza personalizzata su un fatto determinato, un servizio diverso. Il parere preventivo risponde sempre alla prima forma, mai alla seconda.
        - generic [ref=e102]:
          - paragraph [ref=e103]: "02"
          - heading "Indica il tipo di output che vuoi ottenere" [level=3] [ref=e104]
          - paragraph [ref=e105]: Stai cercando di capire come strutturare un prompt? Come verificare una risposta già ottenuta? Come costruire una checklist di revisione per i collaboratori? Ogni obiettivo richiede un approccio diverso nel parere, e chiarirlo in anticipo evita risposte generiche.
        - generic [ref=e106]:
          - paragraph [ref=e107]: "03"
          - heading "Indica quale aspetto metodologico ti interessa approfondire" [level=3] [ref=e108]
          - paragraph [ref=e109]: Il parere copre la materia nella sua interezza, ma se hai già un'idea di quale area di rischio vuoi approfondire — la verifica delle fonti normative, la struttura della fase di generazione, la checklist di revisione — indicarlo permette di dare più spazio a quel punto specifico del metodo.
        - generic [ref=e110]:
          - paragraph [ref=e111]: "04"
          - heading "Non serve il linguaggio tecnico dell'ingegneria dei prompt" [level=3] [ref=e112]
          - paragraph [ref=e113]: "Non devi sapere cosa sia un «system prompt» o un «chain-of-thought». Descrivi il problema con le parole che useresti con un collega: la traduzione nella logica tecnica del metodo è parte del lavoro del parere, non un prerequisito per richiederlo."
    - generic [ref=e115]:
      - generic [ref=e116]:
        - paragraph [ref=e117]: Chi risponde
        - paragraph [ref=e118]: Un parere scritto personalmente, non un output automatico
      - paragraph [ref=e119]: "Ogni consulenza preventiva è scritta personalmente dall'Avv. Giuseppe Cuomo, cassazionista, autore del metodo di verifica anti-allucinazione applicato a tutti i pack di Cuomo Legal Publishing. Non è un servizio automatizzato: è lo stesso lavoro che un collega farebbe rispondendo a un consiglio richiesto in studio, reso scritto e strutturato."
    - generic [ref=e121]:
      - paragraph [ref=e122]: Il parere
      - heading "Cosa contiene il parere scritto" [level=2] [ref=e123]
      - paragraph [ref=e124]: Il parere non è un documento standardizzato né un template generico. Segue una struttura interna progettata per essere direttamente utilizzabile — non per essere archiviata come un adempimento formale. Il suo oggetto è sempre il metodo applicato alla materia indicata, non l'analisi di una situazione concreta.
      - generic [ref=e125]:
        - generic [ref=e126]:
          - paragraph [ref=e128]: "01"
          - generic [ref=e129]:
            - heading "Quadro metodologico e obblighi normativi" [level=3] [ref=e130]
            - paragraph [ref=e131]: "La prima parte, comune a tutte le categorie, espone il quadro aggiornato al 2026: gli obblighi della Legge 132/2025 per i professionisti che utilizzano sistemi di intelligenza artificiale nell'incarico, i meccanismi di errore tipici dei modelli linguistici — allucinazione, obsolescenza non segnalata, confusione tra istituti — e le regole operative di condotta professionale. È la base che permette di valutare correttamente i limiti dello strumento prima di applicare il metodo alla propria materia."
        - generic [ref=e132]:
          - paragraph [ref=e134]: "02"
          - generic [ref=e135]:
            - heading "Rischi specifici per la categoria professionale" [level=3] [ref=e136]
            - paragraph [ref=e137]: "Individua i punti critici documentati nell'area professionale indicata: dove il modello tende a produrre errori specifici in quella disciplina, quali fonti sono più esposte all'obsolescenza, quali istituti o adempimenti vengono più frequentemente confusi tra loro. Il numero di rischi analizzati varia per categoria: sei per i commercialisti, dieci per medici e odontoiatri. La mappa riguarda la materia, non la situazione del singolo richiedente."
        - generic [ref=e138]:
          - paragraph [ref=e140]: "03"
          - generic [ref=e141]:
            - heading "Quadro normativo di riferimento per la materia" [level=3] [ref=e142]
            - paragraph [ref=e143]: "Per ciascuna categoria il parere elenca norma per norma le fonti che governano la pratica quotidiana — codici, decreti legislativi, principi tecnici, circolari ministeriali — e indica quali sono più a rischio di obsolescenza nei modelli linguistici correnti. Non è un riepilogo generico: ogni fonte è accompagnata dall'indicazione del rischio specifico e della banca dati su cui verificare prima della firma."
        - generic [ref=e144]:
          - paragraph [ref=e146]: "04"
          - generic [ref=e147]:
            - heading "Come applicare Loop Engineering™ alla materia specifica" [level=3] [ref=e148]
            - paragraph [ref=e149]: "Descrive come applicare il ciclo A/B/C alla disciplina indicata: quali fonti primarie usare nella fase di verifica, in quale ordine, con quali criteri di arresto. Nella fase di convergenza il modello non auto-approva: produce una checklist di punti aperti che il professionista completa prima di utilizzare l'output. È la logica del metodo spiegata in funzione delle specificità normative e procedurali di quella materia."
        - generic [ref=e150]:
          - paragraph [ref=e152]: "05"
          - generic [ref=e153]:
            - heading "Checklist operativa di revisione professionale" [level=3] [ref=e154]
            - paragraph [ref=e155]: "Una checklist strutturata con i criteri di controllo specifici per la materia, da usare nella fase C del ciclo prima di qualsiasi utilizzo professionale. I criteri variano per categoria: verifica normativa su Normattiva e Agenzia Entrate per i commercialisti, controllo sulla scheda tecnica AIFA per i medici, riscontro su visura catastale e ipotecaria per i notai. La checklist si usa punto per punto nel flusso di lavoro reale — non è un documento da leggere una volta e archiviare."
        - generic [ref=e156]:
          - paragraph [ref=e158]: "06"
          - generic [ref=e159]:
            - heading "Prompt pack operativo in 12 aree di attività" [level=3] [ref=e160]
            - paragraph [ref=e161]: "Allegato al parere dove previsto, il pack contiene trentasei prompt operativi in dodici gruppi tematici — uno per ciascuna area di attività più comune della categoria. Ogni gruppo comprende tre prompt sequenziali: Fase A (Generazione) con regole anti-allucinazione incorporate, Fase B (Verifica) con ciclo normativo, fattuale e formale, Fase C (Convergenza) con produzione della checklist finale. I prompt sono completi e pronti all'uso su qualsiasi piattaforma — ChatGPT, Claude, Gemini — con la sezione [INCOLLA QUI] da completare con i dati del caso."
    - generic [ref=e163]:
      - paragraph [ref=e164]: Il metodo
      - heading "Perché “anti-allucinazione” non è solo un'etichetta" [level=2] [ref=e165]
      - generic [ref=e166]:
        - paragraph [ref=e167]: "Un prompt scritto male non produce un errore evidente — produce un output che sembra corretto. Il metodo alla base di ogni consulenza preventiva si fonda su un principio semplice: separare la fase in cui l'AI propone una risposta dalla fase in cui quella risposta viene verificata, invece di fidarsi del primo output."
        - paragraph [ref=e168]:
          - text: "In pratica, un buon prompt in questa materia non chiede “dammi la risposta” — chiede una prima bozza, poi impone un controllo strutturato su quella bozza (fonti citate, norme in vigore, coerenza tra le parti), e solo dopo produce l'output finale. Chi conosce l'ingegneria dei prompt riconoscerà in questo lo stesso principio dei sistemi “a loop” — bozza, verifica, condizione di arresto — applicato al lavoro professionale regolamentato. La consulenza preventiva non ti consegna un prompt già scritto sul tuo caso: ti aiuta a capire come applicare questo principio nella tua materia, con la logica corretta per quell'ambito specifico."
          - strong [ref=e169]: Il parere scritto include sempre esempi illustrativi di prompt anti-allucinazione, calibrati sul metodo generale della materia
          - text: — così puoi vedere concretamente come il principio si traduce in pratica, non solo descritto in astratto.
      - generic [ref=e170]:
        - paragraph [ref=e171]: Loop Engineering™
        - heading "Il metodo si chiama Loop Engineering™ e si articola in tre fasi sequenziali e obbligatorie." [level=3] [ref=e172]
        - paragraph [ref=e173]: "Ogni attività professionale assistita dall'AI — redazione di un documento, analisi di una norma, verifica di dati tecnici — passa attraverso tre fasi distinte. Nessuna può essere saltata: la fase successiva accetta in ingresso solo l'output della precedente."
        - paragraph [ref=e174]: "Loop Engineering non è un'invenzione dell'Avv. Cuomo — è un principio già affermato nell'ingegneria dei prompt. Quello che l'Avv. Cuomo ha fatto è applicare questo principio al lavoro professionale regolamentato, unendo la propria formazione giuridica alle competenze acquisite nell'ingegneria dei prompt, per costruire un metodo verificabile su decine di materie tecniche, contabili, amministrative e forensi: le tre fasi che seguono."
        - generic [ref=e175]:
          - generic [ref=e176]:
            - paragraph [ref=e177]: "[A]"
            - heading "Generazione" [level=4] [ref=e178]
            - paragraph [ref=e179]: "L'AI produce il documento sulla base di istruzioni calibrate per la specifica area professionale: struttura formale, riferimenti normativi tipici della materia, vincoli di contenuto. È la prima bozza, non l'output finale."
            - paragraph [ref=e180]: "Input: domanda professionale generale. Output: prima bozza non verificata."
          - generic [ref=e181]:
            - paragraph [ref=e182]: "[B]"
            - heading "Verifica — foglio dei controlli" [level=4] [ref=e183]
            - paragraph [ref=e184]: "Il professionista verifica su fonti ufficiali — Normattiva, sito dell'albo, banche dati di categoria. L'AI produce il foglio dei controlli: l'elenco strutturato di cosa verificare e dove. Le fonti le apre e le controlla l'umano, non il modello. L'AI non verifica le norme: le segnala."
            - paragraph [ref=e185]: I cicli di verifica sono separati per evitare interferenze tra tipi di errore diversi.
          - generic [ref=e186]:
            - paragraph [ref=e187]: "[C]"
            - heading "Convergenza — checklist di firma" [level=4] [ref=e188]
            - paragraph [ref=e189]: Il professionista applica la checklist sull'output finale. Se anche un solo marcatore è aperto — [NORMA DA VERIFICARE], [DATO MANCANTE], [GIURISPRUDENZA DA VERIFICARE] — il documento non si firma. Il SÌ finale lo dà il professionista, non il modello.
            - paragraph [ref=e190]: "Output: checklist con caselle vuote per il controllo del professionista. Loop Engineering™ non è un agente autonomo e non sostituisce il giudizio dell'iscritto all'albo."
        - paragraph [ref=e191]: "La consulenza preventiva non ti consegna un prompt già scritto: ti aiuta a capire come applicare Loop Engineering™ nella tua materia specifica. Il parere include sempre esempi illustrativi delle tre fasi, calibrati sull'ambito professionale che hai scelto."
