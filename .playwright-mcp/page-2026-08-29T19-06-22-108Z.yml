          - generic [ref=f3e19]: ·
          - text: Ordine degli Avvocati — Consiglio Nazionale Forense
        - heading "Avvocati" [level=1] [ref=f3e20]
        - generic [ref=f3e21]:
          - paragraph [ref=f3e22]: "La consulenza si articola in tre parti. La Parte Prima espone il quadro metodologico generale per i professionisti forensi che integrano l'intelligenza artificiale nel proprio flusso di lavoro: gli obblighi informativi della Legge 23 settembre 2025, n. 132, i meccanismi con cui i modelli linguistici producono citazioni apparentemente fondate ma non verificabili, e i principi di costruzione del prompt che rendono sistematica la verifica prima della sottoscrizione di qualsiasi atto. La firma dell'avvocato resta il momento di responsabilità esclusiva: il parere serve a preservarne il significato."
          - paragraph [ref=f3e23]: La Parte Seconda entra nel dettaglio della professione forense. Il tema centrale è la produzione di citazioni giurisprudenziali inesistenti — massime con numeri di RG, sezioni e anni che suonano reali ma non corrispondono ad alcuna pronuncia verificabile su banca dati ufficiale. Il parere analizza anche la commistione di disciplina processuale — civile, amministrativa, penale — in prompt generici che non specificano il rito, i limiti delle attività riservate nella redazione di atti processuali, e le tecniche per costruire prompt che ragionino per principi giuridici invece di produrre citazioni non controllate.
          - paragraph [ref=f3e24]: "La Parte Terza fornisce le linee guida operative per la professione forense: le modalità di verifica sistematica degli output su banche dati giuridiche ufficiali, l'impostazione delle fasi di controllo a doppio passaggio per la revisione delle bozze, e il metodo Loop Engineering™ applicato alle attività più frequenti dell'avvocato. Il prompt pack dedicato alla professione forense è in fase di elaborazione e sarà reso disponibile con successivo aggiornamento del preventivo."
      - generic [ref=f3e26]:
        - paragraph [ref=f3e27]: Perché il rischio è alto
        - heading "Dove l'AI sbaglia di più in questa categoria" [level=2] [ref=f3e29]
        - generic [ref=f3e30]:
          - paragraph [ref=f3e32]: "Sentenze inesistenti: il modello produce citazioni con numeri di RG, sezione e anno che suonano reali ma non corrispondono ad alcuna pronuncia. La verifica manuale su banche dati ufficiali è l'unico argine."
          - paragraph [ref=f3e34]: "Normativa processuale mista: termini, riti e competenze variano per materia e rito. Un prompt generico non distingue tra rito civile, amministrativo e penale, producendo output che mescolano disposizioni di riti diversi."
          - paragraph [ref=f3e36]: "Attività riservate: l'AI non può redigere atti in nome di un avvocato né rappresentare nessuno. Un prompt mal impostato genera testi che imitano la forma di un atto processuale firmabile."
