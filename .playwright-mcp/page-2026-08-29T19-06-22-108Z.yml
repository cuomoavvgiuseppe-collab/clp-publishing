          - button "Invia la domanda" [ref=f3e100] [cursor=pointer]
          - paragraph [ref=f3e101]: Il compenso è determinato in relazione alla complessità della domanda, alla materia e alla categoria professionale. Il preventivo scritto con l'importo esatto ti arriverà entro 24 ore lavorative, ai sensi dell'art. 13 L. 247/2012. Nessun impegno prima dell'accettazione.
      - generic [ref=f3e103]:
        - paragraph [ref=f3e104]: La consulenza preventiva ha per oggetto esclusivo il metodo di utilizzo degli strumenti di intelligenza artificiale nella pratica professionale — non costituisce parere su situazioni di fatto concrete, né sostituisce il giudizio professionale dell'iscritto all'albo. Per consulenze su casi specifici è necessario instaurare un rapporto professionale formale con il professionista competente per quella materia.
        - paragraph [ref=f3e105]: Ai sensi della Legge 23 settembre 2025, n. 132 (pubblicata in G.U. n. 225 del 25 settembre 2025), il professionista che utilizza sistemi di intelligenza artificiale nello svolgimento dell'incarico è tenuto a informarne il cliente in modo chiaro e preventivo. La responsabilità professionale rimane integralmente in capo al professionista iscritto all'albo.
